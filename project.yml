    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "6.0"
targets:
  MouseTuner:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
